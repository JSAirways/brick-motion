<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' http://localhost:5173 ws://localhost:5173;"
    />
    <link rel="icon" type="image/jpeg" href="./assets/logo.jpg" />
    <title>Brick-Motion</title>
    <style>
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: #000;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        background:
          linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
          var(--bm-boot-bg-image, url("./assets/splash_screen_01.jpg")) center / cover no-repeat,
          radial-gradient(circle at 20% 20%, rgba(255, 217, 102, 0.35), transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.3), transparent 45%),
          #000;
        color: #f8f9fa;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        z-index: 9999;
      }

      .boot-logo {
        width: 84px;
        height: 84px;
        border-radius: 0.375rem;
        object-fit: cover;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .boot-title {
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .boot-version {
        font-size: 0.9rem;
        font-weight: 400;
        color: rgba(248, 249, 250, 0.82);
      }

      .boot-spinner {
        width: 2rem;
        height: 2rem;
        border: 0.2rem solid rgba(248, 249, 250, 0.28);
        border-top-color: #ffd966;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot-copyright {
        position: absolute;
        left: 50%;
        bottom: 1rem;
        transform: translateX(-50%);
        text-align: center;
        font-size: 0.8rem;
        color: rgba(248, 249, 250, 0.88);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        letter-spacing: 0.01em;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <script src="./boot-splash.js"></script>
    <div id="boot-splash" aria-hidden="true">
      <img class="boot-logo" src="./assets/logo.jpg" alt="" />
      <div class="boot-title">Brick-Motion</div>
      <div class="boot-version" aria-label="Product version"></div>
      <div class="boot-spinner" role="status" aria-label="Loading"></div>
      <div class="boot-copyright">Copyright (c) 2026 Jonan Steiner</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/renderer/main.ts"></script>
  </body>
</html>
